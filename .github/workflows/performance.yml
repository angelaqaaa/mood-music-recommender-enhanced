name: Performance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run performance tests weekly
    - cron: '0 6 * * 0'

jobs:
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run performance tests
      run: |
        pytest tests/performance/test_search_performance.py -v --tb=short

    - name: Run the full-catalog search benchmark
      run: |
        PYTHONHASHSEED=0 MUSICREC_ENV=production python -m src.musicrec.benchmark --repeats 3 --output benchmark-ci.json

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports
        path: benchmark-ci.json
        retention-days: 90